<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Januar Maksum — frontend developer and fullstack practitioner based in Jakarta, Indonesia."
    />
    <meta name="theme-color" content="oklch(96.79% 0.0654 102.26)" />
    <title>Januar Maksum — Frontend Developer</title>
    <script>
      ;(() => {
        const storageKey = 'portfolio-theme'

        try {
          const storedTheme = window.localStorage.getItem(storageKey)
          const theme = storedTheme === 'dark' ? 'dark' : 'light'

          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute(
              'content',
              theme === 'dark'
                ? 'oklch(29.28% 0.0373 94.38)'
                : 'oklch(96.79% 0.0654 102.26)',
            )
        } catch {
          document.documentElement.classList.remove('dark')
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
